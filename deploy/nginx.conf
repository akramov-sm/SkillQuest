# Alternative to Caddy: nginx on the host, SkillQuest listening on 127.0.0.1:8000
# (run it with `python3 run.py` or `docker run -p 127.0.0.1:8000:8000 ...`).
# Replace quest.example.com, get certificates with:  sudo certbot certonly --webroot -w /var/www/certbot -d quest.example.com
# Requires nginx >= 1.25.1 for the "http2 on" directive (on older versions use: listen 443 ssl http2;).
# Start the app with SKILLQUEST_TRUST_PROXY=1 and SKILLQUEST_ALLOWED_HOSTS=quest.example.com.

limit_req_zone $binary_remote_addr zone=skillquest:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name quest.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quest.example.com;

    ssl_certificate     /etc/letsencrypt/live/quest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quest.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 1m;

    location / {
        limit_req zone=skillquest burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
